site_name: Контейнеризация и оркестрация приложений
site_description: Силлабус, лабораторные работы и материалы курса
site_url: https://itmo-faculty-applied-informatics.github.io/course-containerization-orchestration-application/
repo_url: https://github.com/itmo-faculty-applied-informatics/course-containerization-orchestration-application
docs_dir: ../../.site-src/docs
site_dir: ../../site
theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search:
      lang:
        - ru
        - en
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  links:
    anchors: warn
nav:
  - Начало:
      - Главная: README.md
      - Быстрый старт: syllabus/start.md
      - Программа и правила: syllabus/course.md
  - Лабораторные:
      - Обзор: labs/README.md
      - "ЛР 1. Docker": labs/01-docker.md
      - "ЛР 2. Образы Docker": labs/02-docker-image.md
      - "ЛР 3. Персистентность": labs/03-persistence.md
      - "ЛР 4. Docker Compose": labs/04-compose.md
      - "ЛР 5. Kubernetes": labs/05-kubernetes.md
      - "ЛР 6. Kubernetes и CI/CD": labs/06-k8s-cicd.md
  - Сдача и защита:
      - Порядок сдачи: syllabus/submission.md
      - Репозиторий и отчёты: solutions/README.md
  - Оценивание:
      - Баллы и шкала: assessment/README.md
      - Экзамен: assessment/exam.md
      - Общая рубрика: assessment/rubric.md
  - Материалы:
      - Лекции: lectures/README.md
      - Полезные ресурсы: materials/README.md
  - Помощь: materials/faq.md

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/docs/requirements-docs.txt
      - name: Install documentation dependencies
        run: python3 -m pip install -r .github/docs/requirements-docs.txt
      - name: Validate course and test checks
        run: |
          python3 .github/checks/validate_course.py
          python3 -m unittest discover -s .github/checks -p 'test_*.py'
      - name: Prepare documentation
        shell: python
        run: |
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          stage = root / ".site-src"
          docs = stage / "docs"
          # Remove only generated docs, never repository sources.
          if docs.exists():
              shutil.rmtree(docs)
          docs.mkdir(parents=True)

          for name in ("README.md",):
              source = root / name
              if source.is_file():
                  shutil.copy2(source, docs / name)

          # Publish only course materials, not infrastructure or student projects.
          for name in ("syllabus", "lectures", "labs", "materials", "assessment"):
              source = root / name
              if source.is_dir():
                  shutil.copytree(
                      source, docs / name,
                      ignore=shutil.ignore_patterns(
                          ".*", "00-template.md",
                          "__pycache__", ".venv", "venv", "node_modules",
                      ),
                  )

          for relative in (
              "solutions/README.md",
              "solutions/_template/README.md",
          ):
              source = root / relative
              if source.is_file():
                  target = docs / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)

          config = {
              "INHERIT": "../.github/docs/mkdocs.yml",
              "docs_dir": "docs",
              "site_dir": "../site",
          }
          # JSON is valid YAML; keep .github/docs/mkdocs.yml unchanged.
          (stage / "mkdocs.yml").write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Prepared {docs}")
      - name: Check publication boundaries
        run: python3 .github/checks/validate_course.py --staged
      - name: Build documentation
        run: python3 -m mkdocs build --strict --config-file .site-src/mkdocs.yml
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.fork == false
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.fork == false
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
